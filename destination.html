<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Travel Destination</title>

    <link rel="stylesheet" href="style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- ================================
         HERO SECTION
    ================================= -->

    <section class="hero">

        <img id="destination-image" src="" alt="Destination">

        <div class="hero-overlay"></div>

        <div class="hero-content">

            <p id="destination-state"></p>

            <h1 id="destination-name"></h1>

            <p id="destination-description"></p>

        </div>

    </section>


    <!-- ================================
         ABOUT SECTION
    ================================= -->

    <section class="about section">

        <div class="section-heading">

            <span>EXPLORE</span>

            <h2 id="about-title"></h2>

        </div>

        <p id="about-text"></p>

    </section>


    <!-- ================================
         PLACES SECTION
    ================================= -->

    <section class="section">

        <div class="section-heading">

            <span>DISCOVER</span>

            <h2>Places To Visit</h2>

        </div>

        <div id="places-container" class="card-container"></div>

    </section>


    <!-- ================================
         HOTELS SECTION
    ================================= -->

    <section class="section light-section">

        <div class="section-heading">

            <span>STAY</span>

            <h2>Best Hotels</h2>

        </div>

        <div id="hotels-container" class="card-container"></div>

    </section>


    <!-- ================================
         FOOD SECTION
    ================================= -->

    <section class="section">

        <div class="section-heading">

            <span>TASTE</span>

            <h2>Local Food</h2>

        </div>

        <div id="food-container" class="card-container"></div>

    </section>


    <!-- ================================
         TRAVEL TIPS
    ================================= -->

    <section class="section tips-section">

        <div class="section-heading">

            <span>TRAVEL SMART</span>

            <h2>Travel Tips</h2>

        </div>

        <div id="tips-container" class="tips-container"></div>

    </section>


    <!-- ================================
         FOOTER
    ================================= -->

    <footer>

        <h2>EXPLORE INDIA</h2>

        <p>
            Discover beautiful destinations, hidden places
            and unforgettable experiences.
        </p>

        <a href="index.html">Back To Home</a>

    </footer>


    <script src="destination.js"></script>

</body>

</html>
