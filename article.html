<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Travel Article</title>

    <link rel="stylesheet" href="style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <header class="articleHero">

        <img id="articleImage" src="" alt="Travel destination">

        <div class="heroOverlay"></div>

        <div class="heroContent">
            <p id="articleCategory"></p>
            <h1 id="articleTitle"></h1>
            <p id="articleDate"></p>
        </div>

    </header>


    <main class="articleContainer">

        <article class="articleContent">

            <p id="articleIntro" class="intro"></p>

            <div id="articleBody"></div>

        </article>


        <aside class="articleSidebar">

            <div class="sidebarBox">

                <h3>ABOUT THIS ARTICLE</h3>

                <p id="sidebarDescription"></p>

            </div>

            <div class="sidebarBox">

                <h3>CATEGORY</h3>

                <p id="sidebarCategory"></p>

            </div>

            <a href="index.html" class="backButton">
                ← Back to Articles
            </a>

        </aside>

    </main>


    <script src="article.js"></script>

</body>

</html>
